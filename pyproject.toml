[project]
name = "review-bot"
version = "0.0.0"
description = "Security PR review bot: unified diff in, schema-validated findings out."
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "unidiff",
    "detect-secrets",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
review-bot = "review_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_bot"]

[tool.ruff]
line-length = 100
